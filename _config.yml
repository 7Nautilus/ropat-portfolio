baseurl: ""
url: "https://ropat.art"

# ══════════════════════════════════════════════════════════════════════════
#  GOOGLE TAG MANAGER : L'INTERRUPTEUR
# ══════════════════════════════════════════════════════════════════════════
#
# VIDE = pas de conteneur GTM sur le site. Pour le remettre, il suffit de
# recoller l'identifiant ici, rien d'autre :
#
#   gtm_id: "GTM-KN22K5FS"
#
# ⚠️ UN INTERRUPTEUR ET NON DU CODE COMMENTE, deliberement. Un bloc commente
# dans le layout part quand meme chez le visiteur (les commentaires HTML sont
# servis), et surtout une absence ne se relit pas alors qu'une valeur si.
#
# ── POURQUOI IL A ETE RETIRE, le 02/08/2026 ───────────────────────────────
# Mesure sur le fil, en gzip : le conteneur pese 114 705 o et `gtag.js`
# 170 388 o. Le site chargeait LES DEUX, soit environ 278 Ko, alors que le
# conteneur ne declenche AUCUNE balise GA4 : verifie en telechargeant son
# contenu, zero identifiant `G-` a l'interieur. Analytics est charge en direct
# plus bas dans ce meme layout. GTM etait donc 112 Ko et une origine tierce
# sur 64 routes, pour rien.
#
# ⚠️ ET IL NE REGLE PAS LE CONSENTEMENT, contrairement a ce que j'avais dit.
# GTM n'est pas un bandeau : il n'apporte que la plomberie qui retient les
# balises tant que le consentement n'est pas donne. Cette plomberie ne vaut
# quelque chose qu'a PLUSIEURS balises ; avec une seule, l'API `gtag('consent',
# …)` fait la meme chose en quatre lignes.
#
# ⚠️ Le remettre n'a de sens que pour un usage precis et nomme. Si c'est pour
# poser une balise GA4 dedans, IL FAUT RETIRER `gtag.js` du layout DANS LE MEME
# DEPLOIEMENT : sinon chaque page vue est comptee deux fois, et ca ne se voit
# qu'au doublement des chiffres du jour au lendemain.
gtm_id: ""

# Exclusions pour Jekyll
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docs/
  - backup.txt
  - extract_font_sizes.py
  - font_sizes_report.csv
  - VEILLE.md
  - TODO.md
  - CLAUDE.md
  # Sortie de `scripts/carte.rb`. Sans cette ligne Jekyll la rend en /CARTE.html.
  - CARTE.md
  # ⚠️ REGLE, ET ELLE A DEJA MORDU DEUX FOIS : TOUT `.md` VERSIONNE A LA RACINE
  # DOIT ETRE AJOUTE ICI. Jekyll rend n'importe quel Markdown de la racine en
  # page, donc un document de travail versionne se retrouve PUBLIE sur ropat.art
  # sans que rien ne le signale. `.gitignore` ne protege de rien : il decide de
  # ce qui part dans git, pas de ce qui part dans `_site`. C'est meme l'inverse,
  # seuls les fichiers VERSIONNES ont besoin de cette ligne (TODO.md et CLAUDE.md
  # sont ignores par git mais restent exclus ici, car ils existent sur le disque).
  # Premiere morsure : CARTE.md. Seconde : PRODUCT.md, ajoute le 02/08/2026 apres
  # avoir ete commite sans sa ligne, une heure apres que j'aie ecrit cet
  # avertissement pour DOCTRINE.md.
  - DOCTRINE.md
  - PRODUCT.md
  - scripts/
  - DESIGN.md
  # ⚠️ LES PAGES DE TRAVAIL SORTENT DE LA PRODUCTION (29/07/2026). Elles etaient
  # publiees sur ropat.art, protegees par un seul `noindex` : `labo/design-system.html`
  # (1771 lignes, 123 Ko rendus) et `TESTS/dither.html`. Un `noindex` demande a un
  # moteur de ne pas indexer, il n'empeche personne d'ouvrir l'URL.
  # ⚠️ ELLES RESTENT ACCESSIBLES EN LOCAL, via `_config.dev.yml` : c'est ce que
  # lance la tache « Jekyll: Serve ». Le labo a besoin de Jekyll (il inclut
  # `ui/button.html` et lit `site.data`), il ne peut donc pas etre ouvert en
  # `file://`.
  - labo/
  - TESTS/

# ⚠️ LE BLOC `sass:` A ETE RETIRE LE 29/07, ET IL N'A JAMAIS RIEN FAIT.
# Il declarait `style: compressed` et `sass_dir: _sass`. Or :
#   - `assets/css/main.scss` n'a PAS de front matter, donc Jekyll ne le compile
#     jamais, il le COPIE tel quel dans `_site` ;
#   - il n'existe aucun repertoire `_sass` a la racine, les partiels vivent dans
#     `assets/css/_sass/` et sont resolus par les `@use` relatifs.
# Sa presence etait pire que son absence : elle donnait a lire que la compression
# etait configuree, alors que le CSS partait en production non minifie.
# La compilation reelle a lieu dans `.github/workflows/deploy.yml`, etape
# « Compile SCSS into _site ». C'est le seul endroit qui compte.

