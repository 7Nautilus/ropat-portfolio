# ══════════════════════════════════════════════════════════════════════════
#  LES AVIS CLIENTS, TRANSCRITS DEPUIS MALT
# ══════════════════════════════════════════════════════════════════════════
#
# POURQUOI CE FICHIER EXISTE. Malt est la SEULE preuve tierce verifiable du
# site, et elle etait invisible : `malt.fr` sortait 64 fois dans le build, une
# fois par route, et zero fois en lien cliquable. La page A propos citait meme
# la note comme argument sans donner aucun moyen de la verifier. Le lien est
# devenu visible dans le pied de page le 03/08/2026 ; ce fichier prepare
# l'etape suivante, placer chaque avis DANS la fiche du projet qu'il commente.
#
# ETAT AU 03/08/2026 : les **11 avis** sont transcrits, releve complet fait sur
# la session connectee. Le profil porte 5,0 (Qualite 5,0, Delai 5,0,
# Communication 5,0) et 25 projets.
#
# ⚠️ MALT RESTE LA SOURCE DE VERITE, PAS CE FICHIER. Un avis peut etre modifie
# ou retire la-bas sans que rien ne le signale ici.
#
# ⚠️⚠️ NE JAMAIS DERIVER UN COMPTE DE CE FICHIER, meme maintenant qu'il est
# complet. Il porte 11 lignes pour 11 avis, mais **8 CLIENTS DISTINCTS** : trois
# avis viennent du meme (ADF) et deux d'une autre (STRAKARA). Un `size` pose
# quelque part dirait « 11 clients », ce qui serait faux. Le nombre d'avis
# appartient a Malt et se cite avec le lien vers Malt ; le nombre de clients se
# compte sur `entreprise`, jamais sur les lignes.
#
# ⚠️ `texte` N'EST PAS TRADUIT, ET C'EST UNE DECISION. Traduire la phrase d'une
# personne nommee, c'est lui faire dire des mots qu'elle n'a pas ecrits tout en
# continuant a les lui attribuer. Sur les pages anglaises la citation reste en
# francais, et seul le CONTEXTE autour passe en anglais : c'est l'usage courant
# pour une citation, et c'est coherent avec le refus du contenu genere pose
# dans PRODUCT.md. Les autres cles peuvent devenir bilingues, `texte` non.
#
# ⚠️ LA CLE `projet` FAIT TOUT LE TRAVAIL, et elle peut etre vide. Elle porte le
# slug d'une fiche de `_data/projects/`. C'est elle qui permettra de rendre
# l'avis dans la fiche qu'il commente plutot que dans un mur de temoignages. Un
# mur est un piege connu : quatre emplacements sont quatre trous, et un trou
# finit rempli (constate sur sandracreates.com, dont un temoignage sur quatre
# parle d'un court de padel jamais remplace).
# **Un avis dont `projet` est vide, ou dont la fiche n'est pas publiee, ne
# s'affiche nulle part.** Le rendu se derive des fiches existantes, il ne se
# force pas. Aucun consommateur n'existe a ce jour : c'est volontaire, la
# donnee est posee avant le rendu.
#
# ⚠️ DEUX `projet` SEULEMENT SONT RENSEIGNES, LES AUTRES SONT VIDES EXPRES.
# Rattacher l'avis d'un client a la mauvaise fiche lui ferait commenter un
# travail qui n'est pas le sien. `hepwayne` est sur, l'intitule de l'avis
# nommant le projet ; `jhag-banana-rush` a ete confirme par Ropat le 03/08. Les
# neuf autres restent vides tant que le rattachement n'est pas certain, et six
# d'entre eux n'ont de toute facon aucune fiche a rejoindre.
# **Un seul avis est donc affichable aujourd'hui**, celui de Lola sur
# `jhag-banana-rush` : le sien est le seul dont la fiche soit publiee.
#
# ⚠️ SIX CLIENTS SUR HUIT N'ONT AUCUNE FICHE SUR LE SITE : AKIMA PARIS, YVES,
# STRAKARA, NEWRONI, ADF et Cinco. Ils ont paye, ils ont note 5, et le site ne
# les montre pas. C'est le meme constat que celui de la page A propos, vu par
# l'autre bout.
#
# ⚠️⚠️ `publiable` EST OBLIGATOIRE SUR CHAQUE LIGNE, ET IL N'EST PAS DEDUCTIBLE.
# Un avis 5 etoiles n'est pas automatiquement publiable : **ADF est
# BoostFollowers**, dont `docs/INVENTAIRE-2026-08.md` dit « Refus strategique :
# achat de followers, Ropat ne veut pas de l'association », et qui figure dans
# la liste de ses deux refus assumes a cote de la generation de contenu par IA.
# Ce client a laisse TROIS avis, c'est-a-dire la meilleure preuve de « client
# qui revient » du profil, et elle est **inutilisable**. Publier son nom
# reviendrait a annuler le refus qui le justifie.
# Le champ est donc ecrit `true` ou `false` sur TOUTES les entrees, jamais
# omis : un rendu qui testerait l'absence du champ publierait par defaut, et le
# defaut serait la faute.
#
# ⚠️ CE QUE CA CHANGE AU COMPTE DES CLIENTS REVENUS. Deux des huit clients sont
# revenus, ADF (3 avis) et STRAKARA (2). Mais ADF n'est pas publiable, donc la
# preuve affichable du « client qui revient » se reduit a **UN client sur
# huit**. Ne pas annoncer deux.

