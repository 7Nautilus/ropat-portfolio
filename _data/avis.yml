# ══════════════════════════════════════════════════════════════════════════
#  LES AVIS CLIENTS PUBLIABLES, TRANSCRITS DEPUIS MALT
# ══════════════════════════════════════════════════════════════════════════
#
# POURQUOI CE FICHIER EXISTE. Malt est la SEULE preuve tierce verifiable du
# site, et elle etait invisible : `malt.fr` sortait 64 fois dans le build, une
# fois par route, et zero fois en lien cliquable. La page A propos citait meme
# la note comme argument sans donner aucun moyen de la verifier. Le lien est
# devenu visible dans le pied de page le 03/08/2026 ; ce fichier prepare
# l'etape suivante, placer chaque avis DANS la fiche du projet qu'il commente.
#
# ⚠️⚠️ CE FICHIER EST VERSIONNE DANS UN DEPOT PUBLIC. Il ne porte donc QUE des
# avis publiables, et rien qui identifie un client au-dela de ce qu'il a lui-
# meme ecrit publiquement sur Malt. Aucun jugement de Ropat sur un client, sur
# un resultat ou sur une raison de refus n'a sa place ici : ces elements vivent
# dans les notes de travail non versionnees (`docs/`, gitignore). Nettoye le
# 03/08/2026 apres qu'une premiere version en eut porte.
#
# ETAT DU PROFIL AU 03/08/2026, releve sur `malt.fr/profile/victorjarry` :
# **25 projets, 11 evaluations, note 5,0** (Qualite 5,0, Delai 5,0,
# Communication 5,0).
# ⚠️ CES NOTES SONT AGREGEES AU PROFIL, AUCUNE N'APPARTIENT A UN AVIS. Les
# cartes d'avis de Malt ne portent aucun chiffre : ecrire une note a cote du nom
# d'une personne fabriquerait une attribution. Les deux valeurs affichees par le
# site vivent dans `_data/socials.yml`, sur l'entree `malt`, et ne s'affichent
# qu'en nommant LE PROFIL.
#
# ⚠️ MALT RESTE LA SOURCE DE VERITE, PAS CE FICHIER. Un avis peut etre modifie
# ou retire la-bas sans que rien ne le signale ici. C'est pourquoi le chiffre ne
# se cite jamais sans le lien qui permet de le verifier.
#
# ⚠️⚠️ NE JAMAIS DERIVER UN COMPTE DE CE FICHIER, et la raison a change le
# 03/08/2026. Elle etait deja bonne : les lignes ne valent pas les clients,
# puisqu'une meme entreprise peut en porter plusieurs. Elle est desormais plus
# forte : **ce fichier est un SOUS-ENSEMBLE**, il ne contient pas les avis non
# publiables. Un `size` pose ici sous-compterait les avis ET les clients.
# Le nombre d'avis appartient a Malt et se cite avec le lien vers Malt ; le
# releve complet vit dans les notes non versionnees.
#
# ⚠️ `texte` N'EST PAS TRADUIT, ET C'EST UNE DECISION. Traduire la phrase d'une
# personne nommee, c'est lui faire dire des mots qu'elle n'a pas ecrits tout en
# continuant a les lui attribuer. Sur les pages anglaises la citation reste en
# francais, et seul le CONTEXTE autour passe en anglais : c'est l'usage courant
# pour une citation, et c'est coherent avec le refus du contenu genere pose
# dans PRODUCT.md. Les autres cles peuvent devenir bilingues, `texte` non.
#
# ⚠️ LA CLE `projet` FAIT TOUT LE TRAVAIL, et elle peut etre vide. Elle porte le
# slug d'une fiche de `_data/projects/`. C'est elle qui permettra de rendre
# l'avis dans la fiche qu'il commente plutot que dans un mur de temoignages. Un
# mur est un piege connu : quatre emplacements sont quatre trous, et un trou
# finit rempli (constate sur sandracreates.com, dont un temoignage sur quatre
# parle d'un court de padel jamais remplace).
# **Un avis dont `projet` est vide, ou dont la fiche n'est pas publiee, ne
# s'affiche nulle part.** Le rendu se derive des fiches existantes, il ne se
# force pas. Le consommateur existe depuis le 03/08/2026 :
# `_includes/projects/project-avis.html`, appele par `project-main.html`, une
# section entre le recit et le colophon. Il rend DEUX fiches sur vingt-et-une
# (strakara et jhag-banana-rush, recompte le 12/08/2026 ; la phrase disait
# « une fiche sur vingt », vrai avant l'ajout de strakara).
#
# ⚠️ UNE SEULE CLE DE CE FICHIER N'EST LUE PAR PERSONNE : `source`. Elle est
# conservee parce qu'elle documente la provenance du releve, pas parce qu'un
# gabarit l'attend.
# ⚠️ CE PARAGRAPHE EN ANNONCAIT TROIS, et il invoquait la carte en lui faisant
# dire le contraire de ce qu'elle dit. Corrige le 12/08/2026. `date` et
# `intitule` sont RENDUS, par `_includes/projects/project-avis.html:174-192`,
# dans le releve sous la citation, des que `projet` est renseigne. Verifie a
# l'emission : `_site/fr/projects/strakara.html` sort « Mission / Creation du
# logo et des flyers » puis « Avis depose le / 20/04/2026 ». Et `CARTE.md` ne
# liste bien que `source` parmi les cles mortes.
# Ne pas les confondre avec `projet` et `publiable`, qui sont lues par les
# filtres `where:` du rendu et sans lesquelles rien ne sort.
#
# ⚠️ QUATRE `projet` SONT RENSEIGNES, LES AUTRES SONT VIDES EXPRES.
# Rattacher l'avis d'un client a la mauvaise fiche lui ferait commenter un
# travail qui n'est pas le sien. `hepwayne` est sur, l'intitule de l'avis
# nommant le projet ; `jhag-banana-rush` a ete confirme par Ropat le 03/08 ;
# les deux `strakara` le sont depuis le 04/08, la fiche ayant ete ecrite.
# Les autres restent vides tant que le rattachement n'est pas certain.
#
# ⚠️ LA CLE DE RATTACHEMENT EST LE NOM DE FICHIER DE LA FICHE, pas un slug et
# pas l'URL : `project-avis.html` compare `projet` a `include.project_id`, qui
# vaut la cle de `site.data.projects`. Renommer une fiche oblige donc a relire
# ce fichier.
#
# ⚠️ ETAT AU 04/08/2026 : **DEUX fiches affichent un avis**, `jhag-banana-rush`
# et `strakara`. PAS trois avis : le composant selectionne avec `| first`, donc
# il rend **UN SEUL avis par fiche**. Strakara en porte deux dans la donnee, un
# seul sort a l'ecran.
# **Ne pas annoncer « 3 avis affiches » : c'est faux, et je l'ai ecrit avant de
# le mesurer.** Le compte juste est : 2 fiches, 2 citations visibles.
#
# ⚠️ ET C'EST LE PREMIER PROJET A EN PORTER DEUX, donc le premier ou la limite se
# voit. Le `| first` prend l'avis dans l'ordre du fichier, ici « Creation du logo
# et des flyers » — c'est-a-dire celui dont la formulation entre en tension avec
# le texte de la fiche, qui explique que le logo etait fourni. Arbitrage ouvert.
#
# ⚠️ QUATRE DES SEPT CLIENTS PRESENTS ICI N'ONT TOUJOURS AUCUNE FICHE : AKIMA
# PARIS, YVES, NEWRONI et Cinco. Ils ont paye, ils ont note 5, et le site ne les
# montre pas. Le correctif est de PUBLIER DES FICHES, pas d'ajouter des
# temoignages : publier Strakara vient de faire passer les avis affiches de 1 a
# 3 sans qu'une seule citation soit ajoutee.
#
# ⚠️⚠️ `publiable` EST OBLIGATOIRE SUR CHAQUE LIGNE, ET IL N'EST PAS DEDUCTIBLE.
# **Un avis 5 etoiles n'est pas automatiquement publiable.** Le champ est la
# garde qui materialise ce tri. Un rendu qui testerait l'absence du champ
# publierait par defaut, et le defaut serait la faute.
# Il porte aujourd'hui DEUX motifs de `false` qu'il ne faut pas confondre :
#   - un refus definitif, qui a fait sortir des lignes de ce fichier ;
#   - un embargo temporaire, celui de `hepwayne`, **qui devra repasser a
#     `true`** le jour ou sa fiche est publiee.
# Le second est le plus dangereux des deux, parce qu'un `false` qui a survecu a
# sa raison ne fait jamais de bruit.
#
# ⚠️ LA PREUVE DU « CLIENT QUI REVIENT » SE REDUIT A UN SEUL CLIENT ICI,
# STRAKARA, qui porte deux avis. Ne pas en annoncer davantage a partir de ce
# fichier : il est un sous-ensemble, et le compte complet n'y est pas.

# ── Hepwayne ──────────────────────────────────────────────────────────────
- source: malt
  # ⚠️⚠️ SOUS EMBARGO, ET LE MOTIF N'EST PAS LE MEME QUE POUR LES AUTRES.
  # La citation elle-meme ne revele rien : elle ne nomme ni le client, ni le
  # projet. Ce sont `entreprise` et `intitule` qui cassent l'embargo, en
  # annoncant une collaboration avant la sortie du t-shirt. C'est donc la LIGNE
  # qui n'est pas publiable, pas le texte.
  #
  # ⚠️ CE `false` EST TEMPORAIRE ET IL A UNE CONDITION DE LEVEE PRECISE :
  # **le jour ou la fiche `hepwayne` est publiee, repasser ce champ a `true`.**
  # Sans ca l'avis restera invisible alors que son embargo aura expire, et rien
  # ne le signalera : la fiche s'affichera sans sa preuve, en silence. C'est le
  # seul `false` du fichier et c'est le seul qui doive un jour redevenir `true`.
  publiable: false
  auteur: "Marine"
  entreprise: "Hepwayne"
  # Le slug est pose d'avance pour que l'avis se branche seul le jour de la
  # publication. C'est aussi le projet realise EN COLLABORATION avec une
  # illustratrice, donc la premiere fiche cosignee.
  projet: hepwayne
  intitule: "Création de l'identité visuelle et pack d'illustrations"
  date: "2026-07-19"
  texte: "Encore merci pour ton travail ; je recommande Victor les yeux fermés."

