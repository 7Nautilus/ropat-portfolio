context_sections:
  - title:
      fr: "Héritage londonien & Esthétique victorienne"
      en: "London Heritage & Victorian Aesthetic"
    content:
      fr: |
        Conception graphique d'un menu et d'un carton d'invitation pour un événement exclusif de la distillerie Sipsmith. L'objectif était de retranscrire visuellement l'ADN haut de gamme de la marque, profondément ancrée dans l'art de la distillation traditionnelle londonienne. L'habillage graphique fait la part belle aux détails ornementaux raffinés et à une rigueur géométrique évoquant l'époque victorienne.
      en: |
        Graphic design of a menu and invitation card for an exclusive event hosted by Sipsmith Distillery. The creative goal was to capture the high-end DNA of the brand, deeply rooted in traditional London dry gin distillation. The graphic layout emphasizes refined ornamental details and structural geometry evoking the Victorian era.
  - title:
      fr: "Dualité chromatique & Motifs signatures"
      en: "Chromatic Duality & Signature Patterns"
    content:
      fr: |
        La papeterie a été développée en deux variantes contrastées exploitant les deux motifs de tapisserie signatures de la marque. La première version propose un habillage classique utilisant la tapisserie « vert clair sur blanc », offrant une clarté lumineuse sur papier texturé premium. La seconde version décline un concept inversé « vert clair sur vert foncé », créant un effet de clair-obscur prestigieux, idéal pour un dîner nocturne et intimiste.
      en: |
        The stationery suite was developed in two contrasting colorways leveraging the brand's signature background patterns. The first version features a classic setup using the "light green on white" tapestry pattern, offering bright clarity on premium textured paper. The second version presents an inverted "light green on dark green" concept, creating a prestigious chiaroscuro effect, ideal for an intimate evening dinner.
  - title:
      fr: "Grille éditoriale & Choix typographiques"
      en: "Editorial Grid & Typographic Choices"
    content:
      fr: |
        Travail minutieux sur la hiérarchie de l'information pour garantir une lisibilité optimale malgré la densité du menu. La composition s'appuie sur la typographie de titrage *Joane*, aux courbes élégantes et aux empattements marqués, associée au caractère historique *P22 Mackinac Pro* pour le texte de labeur. Cette combinaison assure un équilibre parfait entre élégance classique et lisibilité contemporaine.
      en: |
        Meticulous information hierarchy to ensure optimal readability within the menu's layout constraints. The composition pairs the elegant curves and sharp serifs of the *Joane* display typeface with the historical character of *P22 Mackinac Pro* for body text. This combination strikes a perfect balance between classic elegance and contemporary legibility.

