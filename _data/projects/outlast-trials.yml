context_sections:
  - title:
      fr: "Contexte et objectif"
      en: "Context and objective"
    content:
      fr: |
        Dès la sortie du jeu vidéo Outlast Trials, j'ai adoré son univers visuel et en particulier l'affiche accompagnant la sortie de ce nouvel opus. J'ai donc voulu réaliser ma propre version de cette affiche, en m'inspirant de l'original tout en y apportant ma touche personnelle.
      en: |
        From the moment the Outlast Trials video game was released, I loved its visual universe, particularly the poster accompanying the launch of this new installment. I wanted to create my own version of this poster, drawing inspiration from the original while adding my personal touch.
  - title:
      fr: "Recherche et concept"
      en: "Research and concept"
    content:
      fr: |
        Pour commencer, j'ai analysé les éléments graphiques clés de l'affiche originale, en particulier sa composition dynamique et sa palette de couleurs. J'ai ensuite esquissé plusieurs concepts pour déterminer la meilleure façon de réinterpréter ces éléments tout en conservant l'essence du jeu.
      en: |
        To begin, I analyzed the key graphic elements of the original poster, focusing on its dynamic composition and color palette. I then sketched several concepts to determine the best way to reinterpret these elements while preserving the essence of the game.
  - title:
      fr: "Conception graphique"
      en: "Design execution"
    content:
      fr: |
        Je me suis donc arrêté sur un style en demi-teinte, avec une dominante de vert et de noir, afin de renforcer l'atmosphère rétro-futuriste du jeu. J'ai utilisé Photoshop pour créer les différents éléments graphiques, en particulier l'intégration de la typographie et des effets de texture afin de ne pas trop dénoter de l'original.
      en: |
        I settled on a halftone style, with a dominant green and black color scheme to enhance the game's retro-futuristic atmosphere. I used Photoshop to create the various graphic elements, particularly integrating typography and texture effects to stay true to the original feel.
  - title:
      fr: "Finitions et rendu"
      en: "Finishing touches"
    content:
      fr: |
        Après avoir assemblé les différents éléments de l'affiche, j'ai travaillé sur les ajustements finaux, en ajoutant le plus de détails possible sur les textures. Cette étape a permis de rendre la composition plus cohérente et immersive, tout en ne perdant pas l'aspect brut que donnait la bichromie.
      en: |
        After assembling the different elements of the poster, I worked on the final adjustments, adding as many details as possible to the textures. This step helped make the composition more coherent and immersive while maintaining the raw aspect given by the bichrome.

