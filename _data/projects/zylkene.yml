# Couleur de signal du projet, tiree de l oeuvre elle-meme.
# Releve le 29/07/2026 par echantillonnage de `image_src` : quantification
# en cases de 24, puis la plus SATUREE parmi celles assez frequentes. Une
# moyenne aurait rendu un gris-brun, c est-a-dire l identite de rien.
# mesuree. Contraste 8,67:1 sur --surface.
# ⚠️ Le seuil de 3:1 n est pas impose de l exterieur : les couleurs de
# Lu Yu vont de 3,22 a 13,91 sur son propre fond, la plus basse etant juste
# au-dessus. Une couleur qu on ne voit pas n est pas un signal.
# ⚠️ MESURE, PAS ARBITREE. C est un point de depart pour l oeil de Ropat.
couleur: "#3ab8d9"
featured: false
client: 
  fr: "Vetoquinol"
  en: "Vetoquinol"
year: "2026"
tools: "Photoshop, Illustrator, Affinity"
image_src: /assets/images/projects/zylkene-thumbnail.webp
main_image: /assets/images/projects/zylkene-mockup.webp
# ⚠️ AJOUTE LE 29/07/2026. Le champ manquait alors que l'image mesure 1690x1100,
# donc le defaut 1/1 la decrivait faux. Mesure recoupee par deux decodeurs
# independants.
#
# ⚠️ ET CE N'EST PAS UN CORRECTIF DE CLS, contrairement a ce que j'ai d'abord
# ecrit ici. Mesure faite : sous `nature: contexte`, que portent les 20 projets,
# l'ouverture est en `position: absolute; inset: 0` (pages/_project.scss:149),
# donc sa taille ne depend PAS de l'image et les attributs `width`/`height` ne
# reservent rien. CLS releve au navigateur : 0,0011, et les decalages viennent
# des revelations au defilement, pas du media.
# Ce que la correction change vraiment : `aspect` est la valeur par defaut de
# chaque piece de sequence sans ratio propre (project-main.html:232) et il
# pilote le calcul de rythme. Aucune piece n'herite de ces valeurs aujourd'hui,
# donc rien ne bouge a l'ecran. Le champ redevient simplement VRAI, et il le
# sera le jour ou il portera.
aspect: "1690/1100"
media_type: image
# L'image d'ouverture est une MISE EN SITUATION, pas le livrable : elle peut
# donc passer en fond, saigner et porter le titre. A ne jamais poser sur une
# pochette, une affiche ou un logo, ou le voile falsifierait la couleur que
# le client a signee. Defaut si absent : livrable.
nature: contexte
context:
  fr: "20 ans de la gamme Zylkene"
  en: "20 years of the Zylkene product line"
secteur:
  fr: "Santé animale"
  en: "Animal health"
context_sections:
  - title:
      fr: "Contexte et objectif"
      en: "Context and objective"
    content:
      fr: |
        À l'occasion des **20 ans de la gamme Zylkene**, Vetoquinol souhaitait marquer l'anniversaire avec un goodie commémoratif : une **pochette en tissu**. L'objectif : un objet à la fois utile et désirable, fidèle à l'identité de la marque.
      en: |
        For the **20th anniversary of the Zylkene product line**, Vetoquinol wanted to celebrate the milestone with a commemorative goodie: a **fabric pouch**. The goal: an object that is both useful and desirable, true to the brand's identity.
  - title:
      fr: "Démarche & design"
      en: "Approach & design"
    content:
      fr: |
        J'ai décliné le design graphique sur le support textile, autour des couleurs signatures de la marque, le **bleu Zylkene** et le **vert Vetoquinol**, et de la typographie Exo, le tout pensé pour bien rendre à l'impression sur tissu.
      en: |
        I applied the graphic design to the textile medium, built around the brand's signature colors, **Zylkene blue** and **Vetoquinol green**, and the Exo typeface, all crafted to translate well to fabric printing.
  - title:
      fr: "Résultat"
      en: "Result"
    content:
      fr: |
        Le résultat est une pochette goodie qui célèbre l'anniversaire de Zylkene tout en prolongeant l'univers Vetoquinol au-delà du produit.
      en: |
        The result is a goodie pouch that celebrates Zylkene's anniversary while extending the Vetoquinol world beyond the product itself.
