context_sections:
  - title:
      fr: "Restructuration de format & Grille Pinterest"
      en: "Layout Restructuring & Pinterest Grid"
    content:
      fr: |
        Déploiement de la toute première campagne publicitaire de la marque sur Pinterest. L'enjeu de cette création résidait dans l'adaptation de 14 contenus publicitaires existants pour les transposer dans le format vertical natif 2:3 de la plateforme. Ce travail a nécessité une restructuration complète des compositions d'origine afin de préserver l'équilibre visuel, le prestige des flacons et l'efficacité de lecture propre au flux Pinterest.
      en: |
        Rollout of the brand's very first advertising campaign on Pinterest. The core design challenge was adapting 14 existing ad assets into the platform's native 2:3 vertical format. This required a complete restructuring of the original layouts to maintain visual balance, emphasize bottle luxury, and ensure the high readability required for the Pinterest feed.
  - title:
      fr: "Concepts publicitaires & Hybridation créative"
      en: "Ad Concepts & Creative Hybridization"
    content:
      fr: |
        La campagne s'articule autour de 14 univers créatifs forts mettant en scène différentes lignes iconiques de la marque. Sur ces 14 concepts, 13 ont été traités comme des statics percutants axés sur la lisibilité immédiate du message. Le concept phare « Wild Strawberry & Whipped Cream » a quant à lui bénéficié d'une double exécution : un visuel statique d'une part, et une déclinaison en motion design (vidéo) d'autre part, fluidifiant la narration et maximisant l'engagement des utilisateurs.
      en: |
        The campaign is structured around 14 powerful creative concepts highlighting the brand’s various iconic product lines. Out of these 14 setups, 13 were designed as striking static layouts focused on instant message clarity. The signature concept "Wild Strawberry & Whipped Cream" received a dual execution: a high-impact static visual and a motion design (video) adaptation, enhancing storytelling and user engagement.
  - title:
      fr: "Écosystème typographique & Cohérence"
      en: "Typographic Ecosystem & Visual Consistency"
    content:
      fr: |
        Mise en place d'un système de mise en page rigoureux mariant plusieurs territoires typographiques. La composition s'appuie principalement sur la police institutionnelle *ABChannel*, soutenue par *Raleway* pour les titrages secondaires. Pour assurer une passerelle visuelle harmonieuse, la typographie *CoFo Raffine* a été ponctuellement intégrée sur les concepts liés à la ligne Banana Rush, garantissant une cohérence globale bilingue (français/anglais) forte d'un concept à l'autre.
      en: |
        Implementation of a rigorous layout system merging distinct typographic territories. The layout relies mainly on the institutional typeface *ABChannel*, supported by *Raleway* for secondary display text. To ensure a harmonious brand bridge, the *CoFo Raffine* typeface was selectively integrated into the Banana Rush line concepts, guaranteeing flawless bilingual (English/French) visual consistency across all assets.

