context_sections:
  - title:
      fr: "Le concept du cadre & Récit visuel"
      en: "The Framing Concept & Visual Storytelling"
    content:
      fr: |
        Création de l'identité de marque de l'école supérieure d'audiovisuel Hors Champ. Le concept graphique repose sur une mise en abyme littérale du nom de l'école : jouer sur l'idée du cadre cinématographique, de ce qui est montré et de ce qui est suggéré (le « hors-champ »). Le logotype est ainsi dessiné pour évoquer subtilement la structure et les perforations d'une pellicule de film traditionnelle, capturant la tension créative entre contrainte technique et liberté de narration.
      en: |
        Brand identity creation for the Hors Champ higher school of audiovisual arts. The graphic concept is a literal play on the school's name ("Off-Camera" / "Out of Frame"): exploring the idea of the cinematic frame, what is shown and what is suggested. The logotype is subtly designed to evoke the structure and perforations of a traditional filmstrip, capturing the creative tension between technical constraint and narrative freedom.
  - title:
      fr: "Un système de logo modulaire"
      en: "A Modular Logo System"
    content:
      fr: |
        Conception d'un système de logotype adaptatif pensé pour s'intégrer de manière fluide sur tous les supports physiques et numériques de l'école. L'identité s'articule autour de trois variantes clés : une version signature sur deux lignes optimisée pour les compositions éditoriales, une version horizontale sur une seule ligne pour les bannières et en-têtes étroits, et enfin un monogramme d'initiales « HC » impactant, idéal pour les favicons, avatars et réseaux sociaux.
      en: |
        Design of an adaptive logotype system engineered to fit seamlessly across all physical and digital touchpoints of the school. The brand identity revolves around three key variants: a signature stack on two lines optimized for editorial layouts, a horizontal single-line version for narrow banners and headers, and a high-impact "HC" monogram, perfect for favicons, avatars, and social media.
  - title:
      fr: "Charte graphique & Sobriété technique"
      en: "Brand Guidelines & Technical Minimalist"
    content:
      fr: |
        Développement d'un territoire visuel sobre et haut de gamme, empruntant aux codes minimalistes du cinéma contemporain. L'univers typographique s'appuie sur une police sans-serif géométrique, forte et intemporelle, contrastée par un jeu de grilles strictes inspiré des fenêtres de cadrage. La palette de couleurs est pensée pour s'effacer au profit des productions vidéos des étudiants tout en conservant une signature institutionnelle forte.
      en: |
        Development of a clean and high-end visual territory, borrowing from the minimalist aesthetics of contemporary cinema. The typographic universe relies on a strong, timeless geometric sans-serif, contrasted by structured grids inspired by camera viewfinders. The color palette is designed to recede behind the students' video productions while retaining a powerful institutional signature.

  
