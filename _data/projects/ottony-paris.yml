# ⚠️ AJOUTE LE 29/07/2026. Le champ manquait alors que l'image mesure 1920x1080,
# donc le defaut 1/1 la decrivait faux. Mesure recoupee par deux decodeurs
# independants.
#
# ⚠️ ET CE N'EST PAS UN CORRECTIF DE CLS, contrairement a ce que j'ai d'abord
# ecrit ici. Mesure faite : sous `nature: contexte`, que portent les 20 projets,
# l'ouverture est en `position: absolute; inset: 0` (pages/_project.scss:149),
# donc sa taille ne depend PAS de l'image et les attributs `width`/`height` ne
# reservent rien. CLS releve au navigateur : 0,0011, et les decalages viennent
# des revelations au defilement, pas du media.
# Ce que la correction change vraiment : `aspect` est la valeur par defaut de
# chaque piece de sequence sans ratio propre (project-main.html:232) et il
# pilote le calcul de rythme. Aucune piece n'herite de ces valeurs aujourd'hui,
# donc rien ne bouge a l'ecran. Le champ redevient simplement VRAI, et il le
# sera le jour ou il portera.
aspect: "16/9"
media_type: image
# L'image d'ouverture est une MISE EN SITUATION, pas le livrable : elle peut
# donc passer en fond, saigner et porter le titre. A ne jamais poser sur une
# pochette, une affiche ou un logo, ou le voile falsifierait la couleur que
# le client a signee. Defaut si absent : livrable.
nature: contexte
context:
  fr: "Lancement de la marque Ottony Paris"
  en: "Launch of the Ottony Paris brand"
secteur:
  fr: "Marque de vêtements de luxe"
  en: "Luxury clothing brand"
context_sections:
  - title:
      fr: "Contexte et objectif"
      en: "Context and objective"
    content:
      fr: |
        Ottony Paris est une marque de vêtements de luxe dont j'ai accompagné le lancement. L'enjeu : construire une **identité visuelle distinctive et mémorable**, à la hauteur des aspirations de la marque, capable d'incarner son positionnement haut de gamme dès sa première prise de parole.
      en: |
        Ottony Paris is a luxury clothing brand whose launch I supported. The challenge: to build a **distinctive, memorable visual identity** worthy of the brand's aspirations, able to embody its premium positioning from its very first public appearance.
  - title:
      fr: "Direction créative"
      en: "Creative direction"
    content:
      fr: |
        J'ai fait le choix d'une palette **noir et blanc**, gage d'élégance et d'intemporalité, pour laisser toute la place au vêtement. La typographie Resort Sans porte les titres et l'identité de marque, avec une signature à la fois raffinée et affirmée.
      en: |
        I chose a **black and white** palette, a mark of elegance and timelessness, letting the garment take center stage. The Resort Sans typeface carries the headings and brand identity, with a signature that is both refined and assertive.
  - title:
      fr: "Image de marque"
      en: "Brand image"
    content:
      fr: |
        Décliné en un système cohérent, ce travail dote Ottony Paris d'une image de marque forte, distinctive et immédiatement reconnaissable, fidèle à son univers de luxe.
      en: |
        Rolled out as a coherent system, this work gives Ottony Paris a strong, distinctive and instantly recognizable brand image, true to its luxury world.
