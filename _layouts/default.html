<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
    <meta charset="UTF-8">
    {%- comment -%}
      Google Tag Manager, pilote par `gtm_id` dans `_config.yml`. Vide = rien
      n'est emis, ici comme dans le `<noscript>` en bas de page. L'explication
      complete, et ce qu'il faut verifier avant de le rallumer, sont a cote de
      la cle dans `_config.yml`.

      ⚠️ LE TEST EST ECRIT EN DEUX MORCEAUX, ET CE N'EST PAS DE LA LOURDEUR.
      La premiere version comparait la cle au mot-cle `blank`. Ca se lit juste
      et ca ne filtre RIEN : construit avec une cle vide, le site emettait
      quand meme les deux blocs, dont un `ns.html?id=` a identifiant vide.
      Mesure : 63 pages sur 63, interrupteur eteint. Le mot-cle `blank` ne se
      comporte pas sur une chaine vide comme sa lecture le laisse croire.
      La forme ci-dessous couvre les trois cas sans ambiguite : cle absente
      (nulle, donc fausse), cle vide (egale a la chaine vide), cle renseignee.

      ⚠️ Et ne pas ecrire de delimiteur Liquid dans ce bloc : Liquid analyse
      les tags jusque dans un commentaire, et un delimiteur cite casse le
      build. Meme piege que dans `_includes/layout/footer.html`.
    {%- endcomment -%}
    {%- if site.gtm_id and site.gtm_id != "" -%}
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','{{ site.gtm_id }}');</script>
    <!-- End Google Tag Manager -->
    {%- endif -%}

    {%- comment -%}
      `viewport-fit=cover` est OBLIGATOIRE pour que env(safe-area-inset-*)
      renvoie autre chose que 0. Sans lui, aucune gestion d'encoche n'est
      possible : le site s'arretait au bord logique de l'ecran, pas au bord
      physique.
    {%- endcomment -%}
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="language" content="{{ page.lang | default: 'en' }}"> 

  {% comment %} Si c'est une page de projet, charger les métadonnées depuis _data/projects/<slug>.yml {% endcomment %}
    {% if page.project_id %}
      {% assign project = site.data.projects[page.project_id] %}
      {% assign lang = page.lang | default: "en" %}
      {% if project %}
        {% assign project_locale = project.locales[lang] | default: project.locales.en %}
        {% comment %} og_image : chemin dedie si le projet en declare un, sinon la vignette {% endcomment %}
        {% assign og_image_path = project.og_image | default: project.image_src %}
        {% assign page_og_image = site.url | append: og_image_path %}
        {% if project_locale.seo %}
          {% assign page_title = project_locale.seo.title %}
          {%- comment -%}
            ⚠️ `seo.meta_description` A ETE RETIRE DE CETTE LIGNE le 29/07/2026 :
            cette cle n'existe dans AUCUN des 20 fichiers projet. La premiere
            branche du `default:` ne pouvait donc jamais se declencher, et c'est
            toujours `seo.description` qui servait.
            Une branche qui ne peut pas s'executer ne se contente pas d'etre
            inutile : elle fait croire a un champ qui existerait, et le prochain
            qui voudra changer la description SEO le cherchera la.
          {%- endcomment -%}
          {% assign page_meta_description = project_locale.seo.description %}
          {% assign page_og_title = project_locale.seo.og_title %}
          {% assign page_og_description = project_locale.seo.og_description %}
        {% endif %}
      {% endif %}
    {% endif %}
    
  {% comment %} Utiliser les valeurs du frontmatter ou celles de _data/projects/<slug>.yml {% endcomment %}
    {% assign final_title = page.title | default: page_title %}
    {% assign final_meta_description = page.meta_description | default: page_meta_description %}
    {% assign final_canonical_url = page.canonical_url %}
    {% assign final_og_title = page.og_title | default: page_og_title %}
    {% assign final_og_description = page.og_description | default: page_og_description %}
    {% assign final_og_image = page.og_image | default: page_og_image %}

    {% assign page_path_no_lang = page.url | remove_first: "/fr" | remove_first: "/en" %}

    {% comment %} Déterminer le canonical de la page actuelle {% endcomment %}
    {% if final_canonical_url %}
      {% assign current_canonical = final_canonical_url %}
    {% else %}
      {% assign current_canonical = site.url | append: page.url %}
    {% endif %}

    {% comment %}
      Gestion des hreflang.

      ⚠️ L'ORDRE DES BRANCHES EST LE MECANISME, et il doit rester le meme que
      dans `_includes/lang-selector.html` : `no_alternate` d'abord,
      `hreflang_alternate` ensuite, la substitution de prefixe en dernier
      recours. Le lien visible et ces balises decrivent la meme chose ; quand
      leurs regles divergent, c'est le visiteur d'un cote et Google de l'autre
      qui recoivent deux reponses differentes.
    {% endcomment %}
    {% if page.no_alternate %}
      {% comment %}
        ⚠️ UNE PAGE SANS TRADUCTION NE DECLARE QU'ELLE-MEME. Avant le 29/07,
        `fr/experiences.html` emettait un `hreflang="en"` vers
        `/en/experiences.html`, page qui n'existe pas : le site annoncait a
        Google une version anglaise introuvable. Ne rien declarer est exact ;
        declarer faux ne l'est jamais.
      {% endcomment %}
      <link rel="alternate" hreflang="{{ page.lang | default: 'en' }}" href="{{ current_canonical }}" />
      <link rel="alternate" hreflang="x-default" href="{{ current_canonical }}" />
    {% elsif page.hreflang_alternate %}
      {% if page.lang == 'fr' %}
      <link rel="alternate" hreflang="fr" href="{{ current_canonical }}" />
      <link rel="alternate" hreflang="en" href="{{ page.hreflang_alternate }}" />
      <link rel="alternate" hreflang="x-default" href="{{ page.hreflang_alternate }}" />
      {% else %}
      <link rel="alternate" hreflang="fr" href="{{ page.hreflang_alternate }}" />
      <link rel="alternate" hreflang="en" href="{{ current_canonical }}" />
      <link rel="alternate" hreflang="x-default" href="{{ current_canonical }}" />
      {% endif %}
    {% elsif page_path_no_lang == "/index.html" or page_path_no_lang == "/" %}
      {% comment %}
        ⚠️ CES TROIS URLS DOIVENT ETRE LES FORMES CANONIQUES DES DEUX ACCUEILS,
        ET ELLES NE L'ETAIENT PAS (corrige le 02/08/2026).

        Cette branche ecrivait `/index.html` et `/en/index.html`, alors que le
        front matter des deux accueils declare `canonical_url: https://ropat.art`
        et `https://ropat.art/en/`. Sur les deux pages les plus importantes du
        site, le hreflang designait donc une URL que le canonical de la MEME page
        declarait non canonique.

        Ce que ca coute : un hreflang doit pointer une URL canonique, sinon Google
        ignore l'annotation entiere. L'appariement FR <-> EN de l'accueil n'etait
        donc probablement pas pris en compte, sur le seul couple de pages ou il
        compte vraiment. Releve sur les 63 pages construites : 61 etaient justes,
        ces deux-la seules etaient fausses.

        L'INVARIANT A TENIR : ces deux href doivent rester egaux, au caractere
        pres, aux `canonical_url` de `index.html` et de `en/index.html`. Ils en
        derivent aujourd'hui (`site.url` nu, et `site.url` + `/en/`) ; si l'un des
        deux front matter change de forme, celui-ci doit suivre dans le meme
        commit.

        ⚠️ Le `x-default` continue de pointer l'ANGLAIS. Ce n'est pas un oubli :
        c'est le comportement d'avant, et le changer est un arbitrage
        (l'audience mesuree est francaise) qui n'a pas ete demande ici.
      {% endcomment %}
      <link rel="alternate" hreflang="fr" href="{{ site.url }}" />
      <link rel="alternate" hreflang="en" href="{{ site.url }}/en/" />
      <link rel="alternate" hreflang="x-default" href="{{ site.url }}/en/" />
    {% else %}
      <link rel="alternate" hreflang="fr" href="{{ site.url }}/fr{{ page_path_no_lang }}" />
      <link rel="alternate" hreflang="en" href="{{ site.url }}/en{{ page_path_no_lang }}" />
      <link rel="alternate" hreflang="x-default" href="{{ site.url }}/en{{ page_path_no_lang }}" />
    {% endif %}
    
    <!-- SEO - Gestion des métadonnées -->
    {% if final_title %}
  <!-- Page avec métadonnées dans le front matter ou _data/projects/<slug>.yml -->
        <title>{{ final_title }}</title>
        <meta name="title" content="{{ final_title | replace: '"', '&quot;' }}">
        
        {% if final_meta_description %}
            <meta name="description" content="{{ final_meta_description | replace: '"', '&quot;' }}">
        {% elsif page.lang == 'fr' %}
            <meta name="description" content="Ropat - Portfolio de créations graphiques et design. Découvrez mes projets de pochettes d'album, logos, affiches, animations en motion design et branding.">
        {% else %}
            <meta name="description" content="Ropat - Graphic design portfolio. Explore my projects including album covers, logos, posters, motion design animations, and branding.">
        {% endif %}
    {% endif %}
    
    <meta name="author" content="Ropat">
    <meta name="publisher" content="Ropat">
    <meta name="copyright" content="Ropat">
    <meta name="robots" content="{{ page.robots | default: 'index, follow' }}">

    <!-- Canonical -->
    <link rel="canonical" href="{{ current_canonical }}">

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">

    {%- comment -%}
      ARMEMENT DES REVELATIONS. En ligne et dans le <head>, donc execute AVANT
      le premier rendu : dans script.js (differe) le contenu serait peint a sa
      place finale puis masque d'un coup, ce qui clignote.
      Le masquage de `.animate-fade-up` est desormais conditionne a cette
      classe (cf. base/_animations.scss). Sans elle, le contenu est visible :
      c'est le bon defaut. Avant, `opacity: 0` etait l'etat par defaut en CSS
      et seul le JS le levait, donc 20 elements par page projet, planche
      comprise, disparaissaient si script.js ne s'executait pas.
      Le garde-fou desarme au bout de 2,5 s si script.js n'a jamais confirme :
      une revelation perdue coute une animation, une page blanche coute tout.
    {%- endcomment -%}
    <script>
      document.documentElement.classList.add('reveal-arme');
      setTimeout(function () {
        if (!window.__revelationPrete) document.documentElement.classList.remove('reveal-arme');
      }, 2500);
    </script>

    {%- comment -%}
      LE SENS DE LA NAVIGATION.

      ⚠️ EN LIGNE ET DANS LE <head>, PARCE QUE `pagereveal` SE DECLENCHE AVANT
      LES SCRIPTS DIFFERES. La meme logique a d'abord ete ecrite dans
      script.js : mesure a l'iframe, l'etiquette n'etait JAMAIS posee alors que
      toutes ses conditions etaient reunies, l'ecouteur n'existant pas encore au
      moment de l'evenement. Un `defer` ne rate pas cet evenement bruyamment, il
      le rate en silence.

      Sans cette etiquette, revenir en arriere rejoue exactement l'aller : le
      CSS ne sait rien du sens d'une navigation, donc le retour ferait sortir la
      page a gauche et entrer la precedente par la droite, c'est-a-dire le geste
      d'un pas en AVANT. Le CSS qui s'y accroche est dans
      base/_view-transitions.scss, section « Le retour ».

      ⚠️ `traverse` couvre le retour ET l'avance : c'est la comparaison des
      INDEX d'entree qui distingue les deux, rien d'autre.
    {%- endcomment -%}
    <script>
      window.addEventListener('pagereveal', function (e) {
        if (!e.viewTransition) return;

        /* ⚠️ PAS DE VOILE SUR UNE PAGE QUI A DEJA UN LOADER. Arriver sur
           l'accueil, c'est rencontrer son voile plein ecran : le balayage
           s'ajouterait au loader et on paierait deux fois la meme attente.
           La condition porte sur la PRESENCE DU LOADER, pas sur l'URL de
           l'accueil : le jour ou le loader bouge ou se pose ailleurs, la regle
           suit toute seule au lieu de se perimer en silence.
           Sur, parce que le `<link rel="expect">` ci-dessus garantit que le
           corps est parse a cet instant : verifie, `#pied` est present alors
           que `readyState` vaut encore `loading`. */
        if (document.getElementById('pageLoader')) {
          e.viewTransition.skipTransition();
          return;
        }

        /* ⚠️ SUSPENDRE L'ARRIVEE DU HERO PENDANT LE VOILE, SANS QUOI ELLE JOUE
           DERRIERE LUI. Une animation CSS de la page atteinte demarre des le
           rendu et court PENDANT la transition, cachee par l'instantane : au
           retrait du voile a 0,82 s elle avait deja consomme 65 % de sa course,
           donc on n'en voyait que la fin. Ropat : « l'animation se lance bien
           quand je refresh, mais pas quand je clique sur une carte. »
           J'avais cru l'inverse, que l'instantane figeait l'etat initial et que
           le DOM vivant prenait la main ensuite. L'instantane est bien pris a
           l'etat initial, mais l'animation ne l'attend pas.
           La classe la met en pause, la fin du geste la libere. Sur une arrivee
           froide, sans transition, la classe n'est jamais posee et l'animation
           part tout de suite. */
        document.documentElement.classList.add('voile-en-cours');
        e.viewTransition.finished.finally(function () {
          document.documentElement.classList.remove('voile-en-cours');
        });

        if (!e.viewTransition.types) return;
        var a = window.navigation && window.navigation.activation;
        if (!a || a.navigationType !== 'traverse') return;
        var de = a.from, vers = a.entry;
        if (!de || !vers || typeof de.index !== 'number' || typeof vers.index !== 'number') return;
        if (vers.index < de.index) e.viewTransition.types.add('retour');
      });
    </script>

    {%- comment -%}
      ⚠️ CE LIEN RETARDE LE PREMIER RENDU JUSQU'AU PIED DE PAGE, ET C'EST VOULU.

      `pagereveal` se déclenche avant le premier rendu, donc potentiellement sur
      un document ENCORE EN COURS DE PARSING. Mesure du 29/07/2026 sur la page
      portfolio : `readyState` à `loading` et **6 cartes sur 20** présentes.
      L'appariement de l'œuvre cherchait donc une vignette qui n'existait pas
      encore, et ne trouvait rien. Aucune erreur, aucun signe.

      `rel="expect"` est le mécanisme prévu pour ça : il bloque le rendu tant
      que l'élément visé n'est pas parsé. En visant le pied de page, on garantit
      que le corps entier est là quand `pagereveal` arrive.

      Le coût est réel et assumé : le premier rendu attend la fin du corps. Sur
      ce site les pages sont statiques et légères, mais si le HTML grossit un
      jour, c'est ici qu'il faudra revenir.
    {%- endcomment -%}
    <link rel="expect" blocking="render" href="#pied">

    {%- comment -%}
      L'OEUVRE MENE LA NAVIGATION.

      Entre la grille et la page projet, c'est l'œuvre qui se déplace : la
      vignette cliquée et le média d'ouverture partagent un nom de transition, et
      le navigateur les relie. Le reste de la page se fond derrière.

      Côté page projet le nom est posé en dur dans le CSS, il n'y a qu'une
      ouverture. Côté grille il ne peut pas l'être :

      ⚠️ UN NOM DE TRANSITION DOIT ÊTRE UNIQUE DANS LE DOCUMENT. Deux éléments
      qui le portent font ABANDONNER la transition entière, sans erreur ni
      message. Une grille de vingt cartes ne peut donc pas le porter en CSS : il
      se pose sur UNE carte, au dernier moment.

      ⚠️ EN LIGNE, ET LE MODULE ENTIER, PAS SEULEMENT LE RETOUR. Il vivait dans
      script.js, qui est différé : son écouteur `pagereveal` n'existait donc pas
      encore au moment de l'événement, et le morphing de RETOUR n'a jamais pu se
      déclencher. Le sens aller marchait, lui, parce qu'il passe par `pageswap`,
      émis bien plus tard. On monte les deux ensemble plutôt que le seul retour :
      ils partagent leurs trois fonctions, et les séparer les ferait dériver.
    {%- endcomment -%}
    <script>
      (function () {
        var NOM = 'oeuvre';

        function chemin(url) {
          try { return new URL(url, location.href).pathname; } catch (e) { return null; }
        }

        function vignettePour(url) {
          var cible = chemin(url);
          if (!cible) return null;
          var liens = document.querySelectorAll('.project-card .project-link');
          for (var i = 0; i < liens.length; i++) {
            if (chemin(liens[i].getAttribute('href')) === cible)
              return liens[i].querySelector('.project-card-image img');
          }
          return null;
        }

        /* ⚠️ TOUJOURS NETTOYER AVANT DE POSER. Une page rendue par le cache de
           retour revient telle qu'elle a été quittée, donc AVEC son nom encore
           en place. Un départ suivant vers une autre carte en poserait un
           second, et la transition serait abandonnée sans un mot. */
        function nettoyer() {
          var sales = document.querySelectorAll('.project-card-image img[style*="view-transition-name"]');
          for (var i = 0; i < sales.length; i++) sales[i].style.viewTransitionName = '';
        }

        /* Sortie : on part vers une page projet, la vignette prend le nom.
           `pageswap` plutôt que le clic : il voit TOUTE navigation entre
           documents, retours compris, et il porte la destination. */
        window.addEventListener('pageswap', function (e) {
          if (!e.viewTransition || !e.activation || !e.activation.entry) return;
          nettoyer();
          var img = vignettePour(e.activation.entry.url);
          if (img) img.style.viewTransitionName = NOM;
        });

        /* Retour : on ARRIVE sur la grille en venant d'une page projet, et c'est
           la même vignette qui doit recevoir l'œuvre. L'origine se lit dans
           l'API Navigation ; sans elle le retour se fait sans morphing, ce qui
           n'est pas une panne. */
        window.addEventListener('pagereveal', function (e) {
          if (!e.viewTransition) return;
          var a = window.navigation && window.navigation.activation;
          var depuis = a && a.from ? a.from.url : null;
          if (!depuis) return;
          nettoyer();
          var img = vignettePour(depuis);
          if (!img) return;
          img.style.viewTransitionName = NOM;
          /* Le retirer une fois le geste fini : laissé en place, le prochain
             départ vers une AUTRE carte poserait le même nom deux fois. */
          e.viewTransition.finished.finally(function () {
            img.style.viewTransitionName = '';
          });
        });
      })();
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/main.css?v={{ site.time | date: '%s' }}">

    <!-- Preconnect pour optimiser le chargement des fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    {%- comment -%}
      Une seule requête pour les trois familles : deux link vers le même hôte
      coûtaient deux allers-retours au lieu d'un.
      Chakra Petch : titres, micro-libellés, boutons. STATIQUE, 300 à 700.
      Plus Jakarta Sans : texte de labeur. Variable, 200 à 800, axe `ital`.
      Elle remplace Manrope le 03/08/2026 ; le motif est dans _variables.scss.
      Underdog : accent, sur des mots seulement. Une seule graisse existe.
    {%- endcomment -%}
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;family=Underdog&amp;display=swap" rel="stylesheet">

    {%- comment -%}
      JS. Le fond n'est plus une image mais un shader : plus rien à précharger,
      et main-bg.webp (453 Ko) n'est plus demandé du tout.
    {%- endcomment -%}
    {%- comment -%}
      Jeton de version, comme sur main.css ligne 99. Sans lui, le navigateur
      resservait l'ANCIEN script avec le NOUVEAU CSS : tout comportement pose
      par le JS (etat du chrome, bascule sur fond clair, voir plus) restait
      invisible alors que la feuille de style etait bien a jour. Pire qu'un
      simple retard : les deux moities se desynchronisent.
    {%- endcomment -%}
    <script src="/assets/js/dither.js?v={{ site.time | date: '%s' }}" defer></script>
    <script src="/assets/js/script.js?v={{ site.time | date: '%s' }}" defer></script>

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JDE6T1D92Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JDE6T1D92Q', {
        'anonymize_ip': true,
        'transport_type': 'beacon'
      });
    </script>

    {%- comment -%}
      Icon.
      ⚠️ L'attribut `id` est lu par le module de radar de chargement dans
      script.js, qui remplace `href` pendant le chargement puis le remet.
      Le retirer n'a l'air de rien et desactive le radar en silence.
    {%- endcomment -%}
    <link id="favicon" rel="icon" href="/assets/images/branding/icon.png" type="image/png">

    <!-- Open Graph -->
    {% include meta/open-graph.html 
        og_title=final_og_title 
        og_description=final_og_description 
        og_image=final_og_image 
        og_url=current_canonical
        page_title=final_title 
        page_meta_description=final_meta_description 
    %}
    <!-- Schema.org -->
    {% include meta/schema-org.html 
        page_title=final_title 
        page_meta_description=final_meta_description 
    %}
</head>
<body>

    {%- comment -%}
      Fond dither : remplace main-bg.webp. Rendu par assets/js/dither.js,
      qui s'y accroche seul via cet identifiant. Si WebGL manque, le canvas
      est retiré et la couleur de fond CSS prend le relais.

      ⚠️ CES QUATRE BLOCS ETAIENT DES COMMENTAIRES HTML, donc EMIS, corriges le
      12/08/2026. Mesure sur un build de production frais : 1065 octets par page
      x 66 pages = 70 290 octets de prose de maintenance partis sur le fil, dont
      environ 490 octets gzip par page, sur un depot dont le budget CSS + JS
      entier est de 25 583 o. Un commentaire Liquid n'est pas emis.
      ⚠️ Ce n'est PAS tout ce que les pages emettent en commentaires : il reste
      environ 1216 octets par page en commentaires d'UNE ligne, venus des
      includes. Ces quatre-la etaient les gros.
    {%- endcomment -%}
    <canvas id="fond-dither" aria-hidden="true"></canvas>

    <!-- Curseur personnalisé (desktop uniquement) -->
    <div id="cursor-blob" aria-hidden="true"></div>

    <!-- Skip to content link for accessibility -->
    <a href="#main-content" class="skip-link">
      {% if page.lang == 'fr' %}
        Aller au contenu principal
      {% else %}
        Skip to main content
      {% endif %}
    </a>
    
    {%- comment -%}
      Region d'annonce partagee. Elle doit exister des le rendu initial : une
      region aria-live creee en meme temps que son contenu n'est PAS annoncee,
      les lecteurs d'ecran n'observent que les regions deja presentes au
      moment ou elles changent. Alimentee par annoncer() dans script.js.
    {%- endcomment -%}
    <div id="annonces" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- Language Detection Script -->
    {% include lang-detector.html %}
    
    {%- comment -%} Meme test qu'en tete de page, voir la note qui l'accompagne. {%- endcomment -%}

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ site.gtm_id }}"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    {%- endif -%}

    {% include layout/header.html %}

    {{ content }} 

    {% include layout/footer.html %}
</body>
</html>
